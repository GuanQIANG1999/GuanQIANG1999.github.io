<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Personalized vehicular health diagnosis - system architecture</title><desc id="desc">Vehicle-side and cloud-side architecture connected by a communication network. The Jetson Nano prototype runs Gemma3 1B from sensor and driver-profile inputs. Cloud services include query augmentation, RAG, LLaMA 30B, a knowledge base, and expert curation. Guidance and curated feedback return through separate links. NTN is proposed; the measured prototype used a local network.</desc><rect x="1" y="1" width="1198" height="758" rx="20" fill="#f8fafc" stroke="#dfe7ef"/><path d="M 30 104 H 1170" stroke="#dce5ee" stroke-width="1.5"/><rect x="28" y="140" width="360" height="490" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 29 206 H 387" stroke="#e2e8ef" stroke-width="1.5"/><text x="48" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Vehicle-side system</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Jetson Nano prototype</text><rect x="329" y="154" width="38" height="26.599999999999998" rx="4" fill="#edf3fa" stroke="#7b93aa" stroke-width="1.6"/><path d="M 348.0 180.6 V 188.96 M 337.36 188.96 H 358.64" stroke="#7b93aa" stroke-width="1.6"/><rect x="782" y="140" width="390" height="490" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 783 206 H 1171" stroke="#e2e8ef" stroke-width="1.5"/><text x="802" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Cloud-side services</text><text x="802" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Server: 3 RTX 3090 GPUs</text><rect x="1113" y="154" width="38" height="9.5" rx=