<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Personalized vehicular health diagnosis</title><desc id="desc">Vehicle sensor data and driver profiles feed an on-board lightweight LLM. A compact query traverses an NTN connection to server-side query augmentation and knowledge retrieval, then a cloud LLM produces personalized guidance. The action module conveys warnings. Driver and expert review curate feedback into the knowledge base for future retrieval.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7891aa"/></marker></defs><rect x="1" y="1" width="998" height="598" rx="18" fill="#f8fafc" stroke="#e0e7ef"/><path d="M 235 234 L 275 234" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="273.0,234.0 263.0,239.0 263.0,229.0" fill="#7891aa"/><path d="M 480 234 L 520 234" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="518.0,234.0 508.0,239.0 508.0,229.0" fill="#7891aa"/><path d="M 725 234 L 765 234" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="763.0,234.0 753.0,239.0 753.0,229.0" fill="#7891aa"/><path d="M 867 298 L 867 371" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="867.0,369.0 862.0,359.0 872.0,359.0" fill="#7891aa"/><path d="M 765 434 L 725 434" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="727.0,434.0 737.0,429.0 737.0,439.0" fill="#7891aa"/><path d="M 520 434 L 480 434" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="482.0,434.0 492.0,429.0 492.0,439.0" fill="#7891aa"/><path d="M 275 434 L 235 434" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="237.0,434.0 247.0,429.0 247.0,439.0" fill="#7891aa"/><path d="M 30 434 L 15 434 L 15 126 L 867 126 L 867 171" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="867.0,169.0 862.0,159.0 872.0,159.0" fill="#7891aa"/><path d="M 30 91 H 970" stroke="#dfe6ee" stroke-width="1.5"/><rect x="30" y="171" width="205" height="127" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="132.5" y="216.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">Vehicle data</text><text x="132.5" y="249.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Sensors + driver</text><text x="132.5" y="272.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">profile</text><rect x="275" y="171" width="205" height="127" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="377.5" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">On-board LLM</text><text x="377.5" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Compact query</text><rect x="520" y="171" width="205" height="127" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="622.5" y="228.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">NTN relay</text><text x="622.5" y="261.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Satellite connectivity</text><rect x="765" y="171" width="205" height="127" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="867.5" y="214.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">Query</text><text x="867.5" y="242.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">augmentation</text><text x="867.5" y="275.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">History-aware RAG</text><rect x="765" y="371" width="205" height="127" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="867.5" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">Cloud LLM</text><text x="867.5" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Tailored response</text><rect x="520" y="371" width="205" height="127" rx="14" fill="#eaf6f1" stroke="#b6d9ca" stroke-width="2"/><text x="622.5" y="428.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">Action module</text><text x="622.5" y="461.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Warnings + guidance</text><rect x="275" y="371" width="205" height="127" rx="14" fill="#fff5e6" stroke="#e6d0ac" stroke-width="2"/><text x="377.5" y="402.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">Human</text><text x="377.5" y="430.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">feedback</text><text x="377.5" y="463.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Driver + expert</text><text x="377.5" y="486.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">review</text><rect x="30" y="371" width="205" height="127" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="132.5" y="414.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">Knowledge</text><text x="132.5" y="442.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">base</text><text x="132.5" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Curated RAG context</text><text x="632" y="119" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#74889d" text-anchor="middle">Retrieved context</text><text x="38" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">Responses return via available terrestrial/NTN links; reviewed feedback curates future</text><text x="38" y="547" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">retrieval context.</text><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#29445e" text-anchor="start">Personalized vehicular health diagnosis</text><text x="33" y="72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#74869a" text-anchor="start">LLM-OBD | on-board query generation, RAG, and feedback</text><rect x="36" y="570" width="16" height="16" rx="4" fill="#edf4fc" stroke="#b9cfe5"/><text x="61" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Data / context</text><rect x="235" y="570" width="16" height="16" rx="4" fill="#f0f1fb" stroke="#c9cee8"/><text x="260" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Model / compute</text><rect x="442" y="570" width="16" height="16" rx="4" fill="#fff5e6" stroke="#e6d0ac"/><text x="467" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Policy / control</text><rect x="653" y="570" width=