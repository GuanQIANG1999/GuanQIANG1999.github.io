<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Secure split-learning admission - system architecture</title><desc id="desc">Security architecture separates an untrusted client, the server admission gateway, protected training service, and offline risk-model training. The gateway contains AI risk ranking, risk-adapted Hashcash verification, policy settings, and a temporary blocklist. Only admitted requests reach the protected backend; offline CIC-IDS2017, RFE, and TVAE training supplies the ranker.</desc><rect x="1" y="1" width="1198" height="758" rx="20" fill="#f8fafc" stroke="#dfe7ef"/><path d="M 30 104 H 1170" stroke="#dce5ee" stroke-width="1.5"/><rect x="28" y="145" width="260" height="480" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 29 211 H 287" stroke="#e2e8ef" stroke-width="1.5"/><text x="48" y="173" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Client side</text><text x="48" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Untrusted requests</text><rect x="229" y="159" width="38" height="26.599999999999998" rx="4" fill="#edf3fa" stroke="#7b93aa" stroke-width="1.6"/><path d="M 248.0 185.6 V 193.96 M 237.36 193.96 H 258.64" stroke="#7b93aa" stroke-width="1.6"/><rect x="355" y="145" width="525" height="480" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 356 211 H 879" stroke="#e2e8ef" stroke-width="1.5"/><text x="375" y="173" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Server admission gateway</text><text x="375" y="196" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Security boundary</text><rect x="821" y="159" width="38" height="9.5" rx="3" fill="#edf3fa" stro