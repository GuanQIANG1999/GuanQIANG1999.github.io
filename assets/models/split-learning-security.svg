<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Secure split-learning admission</title><desc id="desc">A client&#x27;s request packet is scored by an AI risk ranker. Low-risk clients receive a risk-adapted Hashcash challenge. A correct and timely client solution admits the client to split learning. High-risk requests and invalid or late solutions enter a blocklist. The offline ranker pipeline uses CIC-IDS2017, recursive feature elimination, and TVAE-based data augmentation.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7891aa"/></marker></defs><rect x="1" y="1" width="998" height="598" rx="18" fill="#f8fafc" stroke="#e0e7ef"/><path d="M 235 249 L 275 249" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="273.0,249.0 263.0,254.0 263.0,244.0" fill="#7891aa"/><path d="M 480 249 L 520 249" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="518.0,249.0 508.0,254.0 508.0,244.0" fill="#7891aa"/><path d="M 725 249 L 765 249" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="763.0,249.0 753.0,254.0 753.0,244.0" fill="#7891aa"/><path d="M 377 315 L 377 447 L 520 447" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="518.0,447.0 508.0,452.0 508.0,442.0" fill="#7891aa"/><path d="M 622 315 L 622 392" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="622.0,390.0 617.0,380.0 627.0,380.0" fill="#7891aa"/><path d="M 30 91 H 970" stroke="#dfe6ee" stroke-width="1.5"/><text x="500" y="132" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#71869c" text-anchor="middle">Offline ranker training: CIC-IDS2017 &gt; RFE + TVAE &gt; risk scoring</text><rect x="30" y="183" width="205" height="132" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="132.5" y="228.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">Client</text><text x="132.5" y="256.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">request</text><text x="132.5" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Network packet</text><rect x="275" y="183" width="205" height="132" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="377.5" y="228.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">AI risk</text><text x="377.5" y="256.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">ranking</text><text x="377.5" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">P(malicious)</text><rect x="520" y="183" width="205" height="132" rx="14" fill="#fff5e6" stroke="#e6d0ac" stroke-width="2"/><text x="622.5" y="231.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">Hashcash gate</text><text x="622.5" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Risk-adapted puzzle</text><text x="622.5" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Verify client solution</text><rect x="765" y="183" width="205" height="132" rx="14" fill="#eaf6f1" stroke="#b6d9ca" stroke-width="2"/><text x="867.5" y="242.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">Admit client</text><text x="867.5" y="275.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Split-learning task</text><rect x="520" y="392" width="205" height="110" rx="14" fill="#fff5e6" stroke="#e6d0ac" stroke-width="2"/><text x="622.5" y="440.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">Blocklist</text><text x="622.5" y="473.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Deny for a set period</text><rect x="454.6" y="152" width="90.8" height="25" rx="5" fill="#f8fafc"/><text x="500" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#657b91" text-anchor="middle">low risk</text><rect x="671.8" y="152" width="148.4" height="25" rx="5" fill="#f8fafc"/><text x="746" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#657b91" text-anchor="middle">valid + timely</text><rect x="363.8" y="405" width="100.39999999999999" height="25" rx="5" fill="#f8fafc"/><text x="414" y="423" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#657b91" text-anchor="middle">high risk</text><rect x="630.8" y="341" width="148.4" height="25" rx="5" fill="#f8fafc"/><text x="705" y="359" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#657b91" text-anchor="middle">invalid / late</text><text x="38" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">Risk thresholds, puzzle difficulty, response time, and blocklist duration are configurable</text><text x="38" y="547" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">policy parameters.</text><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#29445e" text-anchor="start">Secure split-learning admission</text><text x="33" y="72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#74869a" text-anchor="start">Two-stage screening | AI risk ranking + Hashcash verification</text><rect x="36" y="570" width="16" height="16" rx="4" fill="#edf4fc" stroke="#b9cfe5"/><text x="61" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Data / context</text><rect x="235" y="570" width="16" height="16" rx="4" fill="#f0f1fb" stroke="#c9cee8"/><text x="260" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Model / compute</text><rect x="442" y="570" width="16" height="16" rx="4" fill="#fff5e6" stroke="#e6d0ac"/><text x="467" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Policy / control</text><rect x="653" y="570" width="16" height="16" rx="4" fill="#eaf6f1" stroke="#b6d9ca"/><text x="678" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Decision / output</text></svg>