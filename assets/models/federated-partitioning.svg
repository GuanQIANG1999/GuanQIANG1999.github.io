<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Resource-aware federated learning - system architecture</title><desc id="desc">A central server contains a JCRALP controller, a shared CPU pool, and per-client model tails. Heterogeneous client devices retain private data and prefix layers. Activations travel to the server and gradients return to clients. The controller chooses split points and server CPU shares.</desc><rect x="1" y="1" width="1198" height="758" rx="20" fill="#f8fafc" stroke="#dfe7ef"/><path d="M 30 104 H 1170" stroke="#dce5ee" stroke-width="1.5"/><rect x="28" y="140" width="1144" height="284" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 29 206 H 1171" stroke="#e2e8ef" stroke-width="1.5"/><text x="48" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Central federated-learning server</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Shared model-compute boundary</text><rect x="1113" y="154" width="38" height="9.5" rx="3" fill="#edf3fa" stroke="#7b93aa" stroke-width="1.4"/><circle cx="1119.46" cy="158.75" r="1.33" fill="#7b93aa"/><path d="M 1127.44 158.75 H 1145.3" stroke="#7b93aa"/><rect x="1113" y="166.16" width="38" height="9.5" rx="3" fill="#edf3fa" stroke="#7b93aa" stroke-width="1.4"/><circle cx="1119.46" cy="170.91" r="1.33" fill="#7b93aa"/><path d="M 1127.44 170.91 H 1145.3" stroke="#7b93aa"/><rect x="1113" y="178.32" width="38" height="9.5" rx="3" fill="#edf3fa" stroke="#7b93aa" stroke-width="1.4"/><circle cx="1119.46" cy="183.07" r="1.33" fill="#7b93aa"/><path d="M 1127.44 183.07 H 1145.3" stroke="#7b93aa"/><path d="M 490.0 293.0 L 490.0 300.0 M 490.0 306.0 L 490.0 313.0" fill="none" stroke="#b08b55" stroke-width="2.4" stroke-linejoin="round"/><polygon points="490.0,313.0 