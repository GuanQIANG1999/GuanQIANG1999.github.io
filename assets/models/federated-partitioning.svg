ze="22" font-weight="600" fill="#4b5e84" text-anchor="middle">Server tail N</text><text x="1040.0" y="384.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">Layers sN+1 .. L</text><rect x="52" y="490" width="270" height="146" rx="11" fill="#edf4fc" stroke="#bed1e5" stroke-width="1.7"/><text x="187.0" y="534.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#355c7c" text-anchor="middle">Heterogeneous</text><text x="187.0" y="560.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#355c7c" text-anchor="middle">clients</text><text x="187.0" y="590.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">Local compute, energy,</text><text x="187.0" y="611.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">and dataset volumes</text><rect x="378" y="480" width="224" height="148" rx="11" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="490.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#3d6281" text-anchor="middle">Client 1</text><rect x="415" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="457" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="499" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><text x="490.0" y="579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607b96" text-anchor="middle">Prefix layers 1 .. s1</text><text x="490.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#7b8fa3" text-anchor="middle">Private local data</text><path d="M 474.32 628 V 642 H 434.0 H 546.0" fill="none" stroke="#a9bed2" stroke-width="2"/><rect x="653" y="480" width="224" height="148" rx="11" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="765.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#3d6281" text-anchor="middle">Client 2</text><rect x="690" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="732" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="774" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><text x="765.0" y="579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607b96" text-anchor="middle">Prefix layers 1 .. s2</text><text x="765.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#7b8fa3" text-anchor="middle">Private local data</text><path d="M 749.3199999999999 628 V 642 H 709.0 H 821.0" fill="none" stroke="#a9bed2" stroke-width="2"/><rect x="928" y="480" width="224" height="148" rx="11" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="1040.0" y="509" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#3d6281" text-anchor="middle">Client N</text><rect x="965" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="1007" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><rect x="1049" y="526" width="27" height="28" rx="4" fill="#c6d9ee" stroke="#a5bed7"/><text x="1040.0" y="579" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#607b96" text-anchor="middle">Prefix layers 1 .. sN</text><text x="1040.0" y="602" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#7b8fa3" text-anchor="middle">Private local data</text><path d="M 1024.32 628 V 642 H 984.0 H 1096.0" fill="none" stroke="#a9bed2" stroke-width="2"/><text x="52" y="452" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#718eaa" text-anchor="start">Client activations to server</text><text x="52" y="476" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5d9b87" text-anchor="start">Server gradients to clients</text><text x="36" y="683" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#7a8ca0" text-anchor="start">JCRALP uses optimization for profiled systems or modified TD3 when system parameters are uncertain.</text><text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#29465f" text-anchor="start">Resource-aware federated learning</text><text x="35" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#74899d" text-anchor="start">System architecture | heterogeneous clients and a shared server compute pool</text><path d="M 36 731 H 79" fill="none" stroke="#718eaa" stroke-width="2.5"/><text x="90" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Data / model traffic</text><path d="M 420 731 H 427 M 433 731 H 440 M 446 731 H 453 M 459 731 H 466" fill="none" stroke="#b08b55" stroke-width="2.5"/><text x="474" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Policy / training signals</text><path d="M 820 731 H 863" fill="none" stroke="#5d9b87" stroke-width="2.5"/><text x="874" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Response / feedback</text></svg>