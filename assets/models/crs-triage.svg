<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">CRS-Triage - system architecture</title><desc id="desc">Model architecture separates clinical inputs, jointly trained CRS-Triage components, and the decision interface. Structured values with missingness masks and clinical text have separate encoders and evidence heads. Reliability and agreement guide evidence fusion; class probabilities and a confidence head feed a predict-or-defer selection gate.</desc><rect x="1" y="1" width="1198" height="758" rx="20" fill="#f8fafc" stroke="#dfe7ef"/><path d="M 30 104 H 1170" stroke="#dce5ee" stroke-width="1.5"/><rect x="28" y="140" width="210" height="484" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 29 206 H 237" stroke="#e2e8ef" stroke-width="1.5"/><text x="48" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Encounter inputs</text><text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Clinical evidence</text><rect x="280" y="140" width="620" height="484" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 281 206 H 899" stroke="#e2e8ef" stroke-width="1.5"/><text x="300" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">CRS-Triage model</text><text x="300" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Jointly trained multimodal architecture</text><rect x="940" y="140" width="232" height="484" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 941 206 H 1171" stroke="#e2e8ef" stroke-width="1.5"/><text x="960" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Decision interface</text