<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">CRS-Triage</title><desc id="desc">Structured clinical values with a missingness mask and clinical text enter separate encoders and evidence heads. Modality reliability, uncertainty, and cross-modal consistency guide evidential fusion and class probabilities. A confidence score is compared with a threshold: predict acuity for sufficiently confident cases or defer the case for assessment. Under-triage receives a larger training penalty.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#7891aa"/></marker></defs><rect x="1" y="1" width="998" height="598" rx="18" fill="#f8fafc" stroke="#e0e7ef"/><path d="M 235 216 L 275 216" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="273.0,216.0 263.0,221.0 263.0,211.0" fill="#7891aa"/><path d="M 235 417 L 275 417" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="273.0,417.0 263.0,422.0 263.0,412.0" fill="#7891aa"/><path d="M 480 216 L 505 216 L 505 280 L 530 280" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="528.0,280.0 518.0,285.0 518.0,275.0" fill="#7891aa"/><path d="M 480 417 L 505 417 L 505 341 L 530 341" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="528.0,341.0 518.0,346.0 518.0,336.0" fill="#7891aa"/><path d="M 725 310 L 770 310" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="768.0,310.0 758.0,315.0 758.0,305.0" fill="#7891aa"/><path d="M 627 233 L 627 210" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="627.0,212.0 632.0,222.0 622.0,222.0" fill="#7891aa"/><path d="M 870 246 L 870 210" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="870.0,212.0 875.0,222.0 865.0,222.0" fill="#7891aa"/><path d="M 870 374 L 870 416" fill="none" stroke="#7891aa" stroke-width="2.6" stroke-linejoin="round"/><polygon points="870.0,414.0 865.0,404.0 875.0,404.0" fill="#7891aa"/><path d="M 30 91 H 970" stroke="#dfe6ee" stroke-width="1.5"/><rect x="30" y="150" width="205" height="132" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="132.5" y="198.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">Structured data</text><text x="132.5" y="231.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Clinical values +</text><text x="132.5" y="254.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">missingness mask</text><rect x="30" y="351" width="205" height="132" rx="14" fill="#edf4fc" stroke="#b9cfe5" stroke-width="2"/><text x="132.5" y="410.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#365d7f" text-anchor="middle">Clinical text</text><text x="132.5" y="443.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Clinical notes</text><rect x="275" y="150" width="205" height="132" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="377.5" y="184.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">Structured</text><text x="377.5" y="212.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">encoder + head</text><text x="377.5" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Evidence +</text><text x="377.5" y="268.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">uncertainty</text><rect x="275" y="351" width="205" height="132" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="377.5" y="385.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">Text encoder</text><text x="377.5" y="413.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">evidence head</text><text x="377.5" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Evidence +</text><text x="377.5" y="469.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">uncertainty</text><rect x="530" y="233" width="195" height="154" rx="14" fill="#f0f1fb" stroke="#c9cee8" stroke-width="2"/><text x="627.5" y="266.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">Evidence</text><text x="627.5" y="294.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4e5f85" text-anchor="middle">fusion</text><text x="627.5" y="327.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Modality reliability</text><text x="627.5" y="350.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Cross-modal</text><text x="627.5" y="373.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">consistency</text><rect x="530" y="116" width="195" height="94" rx="14" fill="#eaf6f1" stroke="#b6d9ca" stroke-width="2"/><text x="627.5" y="158.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">Class</text><text x="627.5" y="186.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">probabilities</text><rect x="770" y="246" width="200" height="128" rx="14" fill="#fff5e6" stroke="#e6d0ac" stroke-width="2"/><text x="870.0" y="289.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">Confidence</text><text x="870.0" y="317.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#896638" text-anchor="middle">gate</text><text x="870.0" y="350.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">Compare s with tau</text><rect x="770" y="116" width="200" height="94" rx="14" fill="#eaf6f1" stroke="#b6d9ca" stroke-width="2"/><text x="870.0" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">Predict acuity</text><text x="870.0" y="189.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">s &gt;= tau</text><rect x="770" y="416" width="200" height="94" rx="14" fill="#eaf6f1" stroke="#b6d9ca" stroke-width="2"/><text x="870.0" y="456.5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#397663" text-anchor="middle">Defer case</text><text x="870.0" y="489.5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#61758a" text-anchor="middle">s &lt; tau</text><text x="38" y="525" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">Training jointly considers evidential learning, selective prediction, disagreement, and</text><text x="38" y="547" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">under-triage penalties.</text><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#29445e" text-anchor="start">CRS-Triage</text><text x="33" y="72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#74869a" text-anchor="start">Reliability-aware evidence fusion and selective prediction</text><rect x="36" y="570" width="16" height="16" rx="4" fill="#edf4fc" stroke="#b9cfe5"/><text x="61" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Data / context</text><rect x="235" y="570" width="16" height="16" rx="4" fill="#f0f1fb" stroke="#c9cee8"/><text x="260" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Model / compute</text><rect x="442" y="570" width="16" height="16" rx="4" fill="#fff5e6" stroke="#e6d0ac"/><text x="467" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Policy / control</text><rect x="653" y="570" width="16" height="16" rx="4" fill="#eaf6f1" stroke="#b6d9ca"/><text x="678" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Decision / output</text></svg>