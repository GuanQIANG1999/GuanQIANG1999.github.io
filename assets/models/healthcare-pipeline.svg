8" font-weight="400" fill="#7a8ca0" text-anchor="start">Project-level logical architecture; the HPC boundary identifies the supplied deployment environment.</text><text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#29465f" text-anchor="start">Healthcare ML pipeline</text><text x="35" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#74899d" text-anchor="start">System architecture | data sources, ML components, and secure deployment</text><path d="M 36 731 H 79" fill="none" stroke="#718eaa" stroke-width="2.5"/><text x="90" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Data / model traffic</text><path d="M 420 731 H 427 M 433 731 H 440 M 446 731 H 453 M 459 731 H 466" fill="none" stroke="#b08b55" stroke-width="2.5"/><text x="474" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Policy / training signals</text><path d="M 820 731 H 863" fill="none" stroke="#5d9b87" stroke-width="2.5"/><text x="874" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Response / feedback</text></svg>