ial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">Project-level workflow: clinical data processing, modeling, evaluation, and a secure</text><text x="38" y="547" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#718298" text-anchor="start">deployment boundary.</text><text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#29445e" text-anchor="start">Healthcare ML pipeline</text><text x="33" y="72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#74869a" text-anchor="start">Project workflow | secure HPC environment</text><rect x="36" y="570" width="16" height="16" rx="4" fill="#edf4fc" stroke="#b9cfe5"/><text x="61" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Data / context</text><rect x="235" y="570" width="16" height="16" rx="4" fill="#f0f1fb" stroke="#c9cee8"/><text x="260" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Model / compute</text><rect x="442" y="570" width="16" height="16" rx="4" fill="#fff5e6" stroke="#e6d0ac"/><text x="467" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Policy / control</text><rect x="653" y="570" width="16" height="16" rx="4" fill="#eaf6f1" stroke="#b6d9ca"/><text x="678" y="584" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#78899d">Decision / output</text></svg>