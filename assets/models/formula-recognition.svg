<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mathematical formula recognition - system architecture</title><desc id="desc">Conceptual document-recognition architecture. A document image enters an application boundary containing a formula localizer, separate symbol-recognition and two-dimensional structure-parsing components, and a LaTeX serializer. Editable LaTeX is the external output; the displayed fraction is only an output-format example.</desc><rect x="1" y="1" width="1198" height="758" rx="20" fill="#f8fafc" stroke="#dfe7ef"/><path d="M 30 104 H 1170" stroke="#dce5ee" stroke-width="1.5"/><rect x="270" y="140" width="640" height="484" rx="17" fill="#fff" stroke="#c9d6e4" stroke-width="2"/><path d="M 271 206 H 909" stroke="#e2e8ef" stroke-width="1.5"/><text x="290" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#35516b" text-anchor="start">Document recognition system</text><text x="290" y="191" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8190a2" text-anchor="start">Logical application boundary</text><path d="M 210 401 L 244 401 L 244 314 L 296 314" fill="none" stroke="#718eaa" stroke-width="2.4" stroke-linejoin="round"/><polygon points="294.0,314.0 285.0,318.5 285.0,309.5" fill="#718eaa"/><path d="M 546 314 L 580 314" fill="none" stroke="#718eaa" stroke-width="2.4" stroke-linejoin="round"/><polygon points="578.0,314.0 569.0,318.5 569.0,309.5" fill="#718eaa"/><path d="M 732 386 L 732 466" fill="none" stroke="#718eaa" stroke-width="2.4" stroke-linejoin="round"/><polygon points="732.0,464.0 727.5,455.0 736.5,455.0" fill="#718eaa"/><path d="M 885 519 L 929 519 L 929 387 L 952 387" fill="none" stroke="#718eaa" stroke-width="2.4" stroke-linejoin="round"/><polygon points="950.0,387.0 941.0,391.5 941.0,382.5" fill="#718eaa"/><path d="M 40 250 H 170 L 210 290 V 527 H 40 Z" fill="white" stroke="#bbcee2" stroke-width="2"/><path d="M 170 250 V 290 H 210" fill="none" stroke="#bbcee2" stroke-width="2"/><path d="M 61 315 H 184" stroke="#dce5ee" stroke-width="5"/><path d="M 61 344 H 184" stroke="#dce5ee" stroke-width="5"/><path d="M 61 458 H 184" stroke="#dce5ee" stroke-width="5"/><path d="M 61 487 H 184" stroke="#dce5ee" stroke-width="5"/><rect x="61" y="371" width="123" height="60" rx="5" fill="#edf4fc" stroke="#99b8d6" stroke-dasharray="5 4"/><text x="122" y="410" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#547592" text-anchor="middle">a / b</text><text x="125" y="563" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#526f8c" text-anchor="middle">Document image</text><rect x="296" y="251" width="250" height="126" rx="11" fill="#f0f1fb" stroke="#c8cde6" stroke-width="1.7"/><text x="421.0" y="308.5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#4b5e84" text-anchor="middle">Formula localizer</text><text x="421.0" y="338.5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">Detection + extraction</text><rect x="580" y="234" width="305" height="152" rx="12" fill="#f0f1fb" stroke="#c7cde5" stroke-width="1.8"/><text x="595" y="263" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#4d5f83" text-anchor="start">Recognition components</text><rect x="594" y="280" width="277" height="39" rx="6" fill="white" stroke="#d4d9eb"/><text x="732.5" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5a6d89" text-anchor="middle">Symbol recognition</text><rect x="594" y="328" width="277" height="39" rx="6" fill="white" stroke="#d4d9eb"/><text x="732.5" y="353" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5a6d89" text-anchor="middle">2D structure parsing</text><rect x="296" y="466" width="589" height="107" rx="11" fill="#f0f1fb" stroke="#c8cde6" stroke-width="1.7"/><text x="590.5" y="514.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#4b5e84" text-anchor="middle">LaTeX serializer</text><text x="590.5" y="544.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">Build a structured, editable expression</text><rect x="952" y="302" width="220" height="170" rx="11" fill="#eaf6f1" stroke="#afd3c4" stroke-width="1.7"/><text x="1062.0" y="371.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#39725f" text-anchor="middle">Editable LaTeX</text><text x="1062.0" y="401.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">Output format example:</text><text x="1062.0" y="422.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#6a7d90" text-anchor="middle">\frac{a}{b}</text><text x="36" y="683" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#7a8ca0" text-anchor="start">Conceptual module architecture; the fraction illustrates output syntax and is not an accuracy claim.</text><text x="34" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#29465f" text-anchor="start">Mathematical formula recognition</text><text x="35" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#74899d" text-anchor="start">Conceptual architecture | visual recognition components and structured output</text><path d="M 36 731 H 79" fill="none" stroke="#718eaa" stroke-width="2.5"/><text x="90" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Data / model traffic</text><path d="M 420 731 H 427 M 433 731 H 440 M 446 731 H 453 M 459 731 H 466" fill="none" stroke="#b08b55" stroke-width="2.5"/><text x="474" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Policy / training signals</text><path d="M 820 731 H 863" fill="none" stroke="#5d9b87" stroke-width="2.5"/><text x="874" y="737" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#7c8da0" text-anchor="start">Response / feedback</text></svg>